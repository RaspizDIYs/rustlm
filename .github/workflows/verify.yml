# PR/master: Next build + cargo check для прод и для goodluck-test (test.gltournament.ru).
# Публичные релизы не трогает — см. release.yml.
name: Verify

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check application versions
        run: node scripts/check-release-version.mjs

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure Windows SDK
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: verify

      - name: Install frontend dependencies
        run: npm ci

      - name: Next.js build
        run: npm run build

      - name: JavaScript behavior tests
        run: node --test scripts/*.test.mjs

      - name: Rust behavior tests
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: node ../scripts/run-rust-test.cjs
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Native LCU integration and replay
        run: node scripts/test-lcu-integration.mjs

      - name: Cargo check (prod — gltournament.ru)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo check (goodluck-test — test.gltournament.ru)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features goodluck-test
