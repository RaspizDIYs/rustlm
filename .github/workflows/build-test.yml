# Сборка тестовой версии: установщик NSIS + portable exe уходят артефактами.
# Запускается вручную из Actions или пушем в ветку test/**. Ничего не публикует:
# ни релиза, ни тега, ни обновления для пользователей.
name: Build test artifact

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/**'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: test-artifact

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: RustLM-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: RustLM-portable
          path: |
            src-tauri/target/release/rustlm.exe
            src-tauri/target/release/RustLM.exe
          if-no-files-found: warn
